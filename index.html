<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RigMaster: Paint & Drive Simulator</title>
    <meta name="description" content="Simulador top-down de manobras de camião e atrelados com física Matter.js, sistema híbrido de licenças, garagens e editor de mapas Paint & Drive." />
    <meta property="og:title" content="RigMaster: Paint & Drive Simulator" />
    <meta property="og:description" content="Simulador top-down de manobras de camião e atrelados com física Matter.js, sistema híbrido de licenças, garagens e editor de mapas Paint & Drive." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0c0f17;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0c0f17;
        color: #cbd5e1;
      }
      #boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: rig-spin 0.8s linear infinite;
      }
      @keyframes rig-spin { to { transform: rotate(360deg); } }
      #boot-error {
        display: none;
        max-width: 440px;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid rgba(248, 113, 113, 0.35);
        background: rgba(30, 41, 59, 0.9);
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
      }
      #boot-error button {
        margin-top: 12px;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        background: #0ea5e9;
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div id="boot-spinner"></div>
        <div id="boot-status" style="font-size:14px;font-weight:600;letter-spacing:0.03em;">A carregar RigMaster…</div>
        <div id="boot-error">
          <div id="boot-error-msg" style="color:#fca5a5;word-break:break-word;"></div>
          <button type="button" onclick="window.location.replace(window.location.pathname + '?_r=' + Date.now())">Recarregar</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function showBootError(msg) {
          var box = document.getElementById('boot-error');
          var txt = document.getElementById('boot-error-msg');
          var spin = document.getElementById('boot-spinner');
          var status = document.getElementById('boot-status');
          if (!box || !txt) return;
          if (spin) spin.style.display = 'none';
          if (status) status.textContent = 'Não foi possível iniciar o jogo';
          txt.textContent = msg || 'Erro inesperado ao carregar os módulos.';
          box.style.display = 'block';
        }
        window.__showBootError = showBootError;
        var handlingScriptErr = false;
        window.__handleMainScriptError = function (scriptEl) {
          if (window.__rigAppMounted || handlingScriptErr) return;
          handlingScriptErr = true;
          var src = (scriptEl && scriptEl.getAttribute && scriptEl.getAttribute('src')) || '/src/main.tsx';
          var status = document.getElementById('boot-status');
          if (status) status.textContent = 'A reconectar ao servidor…';

          // Track up to 2 automatic fresh-document reloads within a 30s window so a cold Cloud Run
          // restart or transient proxy hiccup recovers automatically without looping forever.
          var now = Date.now();
          var retryCount = 0;
          try {
            var raw = sessionStorage.getItem('rigmaster_boot_retry');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && now - parsed.ts < 30000) retryCount = Number(parsed.count) || 0;
            }
          } catch (_) {}

          if (retryCount >= 2) {
            showBootError('Falha ao carregar ' + src + '. Clique em Recarregar para tentar novamente.');
            return;
          }

          var attempts = 0;
          function probeAndReload() {
            if (window.__rigAppMounted) return;
            attempts++;
            fetch(src + '?_ping=' + Date.now(), { cache: 'no-store' })
              .then(function (r) {
                var ct = (r.headers.get('content-type') || '').toLowerCase();
                if (r.ok && ct.indexOf('javascript') !== -1) {
                  try {
                    sessionStorage.setItem('rigmaster_boot_retry', JSON.stringify({ ts: Date.now(), count: retryCount + 1 }));
                  } catch (_) {}
                  window.location.replace(window.location.pathname + '?_r=' + Date.now());
                  return;
                }
                throw new Error('HTTP ' + r.status + ' (' + (ct || 'sem content-type') + ')');
              })
              .catch(function (err) {
                if (window.__rigAppMounted) return;
                if (attempts < 4) {
                  setTimeout(probeAndReload, 1200);
                } else {
                  var detail = err && err.message ? ' [' + err.message + ']' : '';
                  showBootError('Falha ao carregar ' + src + detail + '. Clique em Recarregar.');
                }
              });
          }
          setTimeout(probeAndReload, 700);
        };
        window.addEventListener('error', function (e) {
          if (window.__rigAppMounted) return;
          var target = e && e.target;
          if (target && target !== window && target.tagName === 'SCRIPT') {
            window.__handleMainScriptError(target);
            return;
          }
          showBootError((e && (e.message || (e.error && e.error.message))) || 'Erro de carregamento.');
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (!window.__rigAppMounted) {
            var r = e && e.reason;
            showBootError((r && r.message) || String(r || 'Falha ao carregar recursos.'));
          }
        });
        setTimeout(function () {
          if (!window.__rigAppMounted && !handlingScriptErr && document.getElementById('boot-splash')) {
            var info = '';
            try {
              var entries = performance.getEntriesByType('resource') || [];
              info = ' (' + entries.length + ' recursos carregados)';
            } catch (_) {}
            showBootError('O carregamento demorou demasiado tempo' + info + '. Clique em Recarregar para tentar novamente.');
          }
        }, 30000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
